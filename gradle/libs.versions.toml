[versions]
kotlin = "2.3.10"
kotlinx-coroutines = "1.10.2"
kotlinx-datetime = "0.7.1"
kotlinx-serialization = "1.9.0"
ktor = "3.4.1"
bitcoinkmp = "0.31.0" # when upgrading bitcoin-kmp, keep secpjnijvm in sync!
# The Iceberg fork of secp256k1-kmp, published to the local Maven repository under a distinct
# version by sources/lightning-kmp/publish-iceberg-secp256k1.sh (do NOT shadow upstream's 0.23.0).
# darwin/mingw native libs stay on upstream 0.23.0: the fork only ships the linux natives.
secpjnijvm = "0.23.0-iceberg"
secpjnijvmupstream = "0.23.0"
kermit = "2.0.8"
slf4j = "2.0.17"

# test dependencies
test-kotlinx-io-core = "0.8.0"
test-bouncycastle = "1.64"
test-logback = "1.5.19"
test-sqlitejdbc = "3.50.3.0"

[plugins]
multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
dokka = { id = "org.jetbrains.dokka", version = "2.0.0" }
